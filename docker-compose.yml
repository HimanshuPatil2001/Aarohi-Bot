version: '3.8'

services:
  aarohi-bot:
    image: aarohi-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarohi-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=tcp:YOUR_DB_IP,1433;Database=companion Db;User Id=sa;Password=YOUR_PASSWORD;TrustServerCertificate=True;
      - Telegram__BotToken=YOUR_TELEGRAM_BOT_TOKEN
      - Telegram__WebhookSecretToken=YOUR_OPTIONAL_SECRET
      - Groq__ApiKey=YOUR_GROQ_API_KEY
      - Groq__FastModel=llama-3.1-8b-instant
      - Groq__DeepModel=llama-3.3-70b-versatile
